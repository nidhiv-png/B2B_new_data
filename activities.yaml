# Regenerated from the real generator logic (simulation.py). Documents which
# events/state-changes each workflow actually emits — no metric formulas.
# Grouped to match vedha_tessera_model_v2.html's Entities/Activities/Dimensions
# schema (Financial -> Company -> Functional).

activities:

  # ── Financial — P&L ──────────────────────────────────────────────────────

  - name: recognise_revenue
    entity: RevenueLine
    type: create
    attributes: [revenue_line_id, revenue_type, amount_usd, occurred_at]

  # incur_cost is Cost & Burn's `incur` (below) rolling up into P&L; forecast
  # is not modeled (no forward-looking projection table exists).

  # ── Company — Cost & Burn ────────────────────────────────────────────────

  - name: incur
    entity: CostTransaction
    type: create
    attributes: [cost_id, vendor_id, cost_line, function, amount_usd, occurred_at]

  - name: allocate
    entity: Headcount
    type: snapshot
    attributes: [headcount_id, function, headcount_count, people_cost_usd]

  # ── Company — Revenue engine (MRR movement bridge) ──────────────────────

  - name: new
    entity: MrrMovement
    type: create
    attributes: [movement_id, account_id, mrr_delta_usd, seats_delta, occurred_at]

  - name: reactivate
    entity: MrrMovement
    type: create
    attributes: [movement_id, account_id, mrr_delta_usd, occurred_at]

  - name: expand
    entity: MrrMovement
    type: create
    attributes: [movement_id, account_id, mrr_delta_usd, seats_delta, occurred_at]

  - name: contract        # HTML's own name for the Contraction movement type
    entity: MrrMovement
    type: create
    attributes: [movement_id, account_id, mrr_delta_usd, occurred_at]

  - name: churn
    entity: MrrMovement
    type: create
    attributes: [movement_id, account_id, mrr_delta_usd, seats_delta, occurred_at]

  - name: renew
    entity: MrrMovement
    type: create
    attributes: [movement_id, account_id, mrr_delta_usd, occurred_at]

  # ── Acquisition ───────────────────────────────────────────────────────────

  - name: campaign_launched
    entity: Campaign
    type: create
    attributes: [campaign_id, campaign_name, channel, start_at, budget_usd]

  # impression / click are NOT event-level rows — kept as monthly aggregates
  # on Campaign (impressions/clicks/ctr/cpc) and weekly-allocated aggregates
  # on CampaignWeekly. Deliberate scope reduction: event-level rows would be
  # a large volume increase for little analytical value beyond the aggregate.

  - name: LP_visit
    entity: Visitor
    type: event
    attributes: [visitor_id, campaign_id, lp_url, device_type, first_seen_at]

  - name: signup
    entity: Visitor
    type: state_change
    attributes: [visitor_id, converted_user_id, signup_at, did_signup]

  - name: qualify
    entity: Visitor
    type: state_change
    attributes: [visitor_id, is_qualified, qualified_at]

  # ── Activation ────────────────────────────────────────────────────────────

  - name: user_signed_up
    entity: User
    type: create
    attributes: [user_id, account_id, motion, signup_at]

  - name: setup                 # self-serve step 1 / sales-led kickoff_call
    entity: UsageEvent
    type: event
    attributes: [event_id, user_id, onboarding_step_name, occurred_at]

  - name: connect_data           # self-serve step 2 / sales-led data_migration
    entity: UsageEvent
    type: event
    attributes: [event_id, user_id, onboarding_step_name, occurred_at]

  - name: first_action           # self-serve step 3 / sales-led admin_permissions_set
    entity: UsageEvent
    type: event
    attributes: [event_id, user_id, onboarding_step_name, occurred_at]

  - name: invite_team            # self-serve step 4 / sales-led team_rollout
    entity: UsageEvent
    type: event
    attributes: [event_id, user_id, onboarding_step_name, occurred_at]

  - name: reach_value            # Value-moment — tracked as User.value_moment_at, not a UsageEvent row
    entity: User
    type: state_change
    attributes: [user_id, value_moment_at]

  - name: feature_used
    entity: UsageEvent
    type: event
    attributes: [event_id, user_id, feature_name, is_core_action, occurred_at]

  # ── Retention ─────────────────────────────────────────────────────────────

  - name: core_action
    entity: UsageEvent
    type: event
    attributes: [event_id, user_id, is_core_action, occurred_at]

  - name: support
    entity: SupportTicket
    type: create
    attributes: [ticket_id, account_id, category, severity, opened_at]

  - name: support_ticket_resolved
    entity: SupportTicket
    type: update
    attributes: [ticket_id, resolved_at, resolution_hours, csat_score]

  - name: health_score_computed
    entity: HealthScoreSnapshot
    type: snapshot
    attributes: [snapshot_id, account_id, week_start, score, health_band]

  - name: QBR
    entity: QBR
    type: event
    attributes: [qbr_id, account_id, csm_id, qbr_date]

  # ── Expansion ─────────────────────────────────────────────────────────────

  - name: expansion_opportunity_identified
    entity: ExpansionOpportunity
    type: create
    attributes: [opp_id, account_id, trigger_type, expected_mrr_uplift, identified_at]

  - name: hit_limit
    entity: ExpansionActivity
    type: event
    attributes: [activity_id, opp_id, account_id, occurred_at]

  - name: upsell_convo
    entity: ExpansionActivity
    type: event
    attributes: [activity_id, opp_id, account_id, occurred_at]

  - name: seat_add
    entity: ExpansionActivity
    type: event
    attributes: [activity_id, opp_id, account_id, occurred_at]

  - name: tier_upgrade
    entity: ExpansionActivity
    type: event
    attributes: [activity_id, opp_id, account_id, occurred_at]

  - name: add_on_buy
    entity: ExpansionActivity
    type: event
    attributes: [activity_id, opp_id, account_id, occurred_at]

  - name: expansion_opportunity_closed_won
    entity: ExpansionOpportunity
    type: state_change
    attributes: [opp_id, account_id, closed_at, expected_mrr_uplift]

  - name: expansion_opportunity_closed_lost
    entity: ExpansionOpportunity
    type: state_change
    attributes: [opp_id, account_id, closed_at]

  # ── Monetisation ──────────────────────────────────────────────────────────

  - name: contract_signed
    entity: Contract
    type: create
    attributes: [contract_id, account_id, plan_id, arr, billing_cycle, start_at]

  - name: price_change
    entity: PriceChangeEvent
    type: create
    attributes: [price_change_id, plan_tier, old_price_per_seat, new_price_per_seat, effective_at]

  - name: discount_grant
    entity: DiscountGrant
    type: create
    attributes: [grant_id, contract_id, account_id, discount_pct, granted_at]

  - name: add_on_attach
    entity: AddonAttach
    type: create
    attributes: [attach_id, contract_id, account_id, addon_id, addon_mrr, attached_at]

  - name: renewal_pricing
    entity: MrrMovement       # the `renew` movement type carries the renewal MRR delta
    type: create
    attributes: [movement_id, account_id, mrr_delta_usd, occurred_at]
