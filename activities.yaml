activities:

  # ── Acquisition ──────────────────────────────────────────────────────────────

  - name: campaign_launched
    entity: Campaign
    type: create
    attributes:
      - campaign_id
      - campaign_name
      - channel
      - start_date
      - budget_usd
      - launched_at

  - name: visitor_session_started
    entity: Visitor
    type: event
    attributes:
      - visitor_id
      - campaign_id
      - landing_page
      - device_type
      - session_started_at

  - name: visitor_converted_to_signup
    entity: Visitor
    type: state_change
    attributes:
      - visitor_id
      - user_id
      - converted_at

  # ── Activation ────────────────────────────────────────────────────────────────

  - name: user_signed_up
    entity: User
    type: create
    attributes:
      - user_id
      - account_id
      - email
      - acquisition_channel
      - signup_at

  - name: account_created
    entity: Account
    type: create
    attributes:
      - account_id
      - company_name
      - industry
      - icp_segment
      - created_at

  - name: onboarding_step_completed
    entity: UsageEvent
    type: event
    attributes:
      - event_id
      - user_id
      - onboarding_step_name
      - occurred_at

  - name: user_activated
    entity: User
    type: state_change
    attributes:
      - user_id
      - account_id
      - activated_at
      - core_actions_completed

  - name: feature_used
    entity: UsageEvent
    type: event
    attributes:
      - event_id
      - user_id
      - feature_name
      - is_core_action
      - occurred_at

  - name: session_started
    entity: UsageEvent
    type: event
    attributes:
      - event_id
      - user_id
      - session_id
      - platform
      - occurred_at

  # ── Monetisation ──────────────────────────────────────────────────────────────

  - name: seat_assigned
    entity: Seat
    type: create
    attributes:
      - seat_id
      - account_id
      - user_id
      - plan_id
      - seat_mrr
      - assigned_at

  - name: contract_signed
    entity: Contract
    type: create
    attributes:
      - contract_id
      - account_id
      - plan_id
      - arr_usd
      - billing_cycle
      - start_at

  - name: contract_renewed
    entity: Contract
    type: update
    attributes:
      - contract_id
      - account_id
      - renewed_at
      - renewal_arr_usd
      - new_end_at

  - name: plan_upgraded
    entity: Account
    type: state_change
    attributes:
      - account_id
      - from_plan_id
      - to_plan_id
      - upgraded_at

  - name: plan_downgraded
    entity: Account
    type: state_change
    attributes:
      - account_id
      - from_plan_id
      - to_plan_id
      - downgraded_at

  # ── Retention ─────────────────────────────────────────────────────────────────

  - name: support_ticket_opened
    entity: SupportTicket
    type: create
    attributes:
      - ticket_id
      - account_id
      - user_id
      - category
      - priority
      - opened_at

  - name: support_ticket_resolved
    entity: SupportTicket
    type: update
    attributes:
      - ticket_id
      - resolved_at
      - resolution_hours
      - csat_score

  - name: health_score_computed
    entity: HealthScoreSnapshot
    type: snapshot
    attributes:
      - snapshot_id
      - account_id
      - week_start
      - score
      - health_band

  - name: health_score_degraded
    entity: HealthScoreSnapshot
    type: alert
    attributes:
      - snapshot_id
      - account_id
      - previous_score
      - current_score
      - week_start

  - name: churn_risk_flagged
    entity: Account
    type: state_change
    attributes:
      - account_id
      - health_score
      - flagged_at
      - risk_reason

  - name: account_churned
    entity: Account
    type: state_change
    attributes:
      - account_id
      - churned_at
      - churn_reason
      - final_mrr

  - name: seat_churned
    entity: Seat
    type: update
    attributes:
      - seat_id
      - account_id
      - user_id
      - churned_at

  # ── Expansion ─────────────────────────────────────────────────────────────────

  - name: expansion_opportunity_identified
    entity: ExpansionOpportunity
    type: create
    attributes:
      - opportunity_id
      - account_id
      - opportunity_type
      - expansion_mrr_potential
      - identified_at

  - name: expansion_opportunity_progressed
    entity: ExpansionOpportunity
    type: update
    attributes:
      - opportunity_id
      - previous_stage
      - new_stage
      - updated_at

  - name: expansion_opportunity_closed_won
    entity: ExpansionOpportunity
    type: state_change
    attributes:
      - opportunity_id
      - account_id
      - closed_at
      - expansion_mrr_realised

  - name: expansion_opportunity_closed_lost
    entity: ExpansionOpportunity
    type: state_change
    attributes:
      - opportunity_id
      - account_id
      - closed_at
      - lost_reason

  - name: cohort_snapshot_recorded
    entity: Cohort
    type: snapshot
    attributes:
      - cohort_id
      - cohort_period
      - user_count
      - activated_count
      - activation_rate
